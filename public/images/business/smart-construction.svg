<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EAB308;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad1)"/>
  
  <!-- Title Text -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" opacity="0.9" font-weight="bold">智慧工地</text>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.7">Smart Construction Site</text>
  
  <!-- Construction Site Elements -->
  <g transform="translate(200, 150)">
    <!-- Building Structure -->
    <rect x="0" y="100" width="120" height="150" fill="white" opacity="0.3" rx="5"/>
    <rect x="10" y="110" width="100" height="130" fill="white" opacity="0.2" rx="3"/>
    
    <!-- Windows -->
    <rect x="20" y="120" width="15" height="15" fill="white" opacity="0.4"/>
    <rect x="40" y="120" width="15" height="15" fill="white" opacity="0.4"/>
    <rect x="60" y="120" width="15" height="15" fill="white" opacity="0.4"/>
    <rect x="80" y="120" width="15" height="15" fill="white" opacity="0.4"/>
    
    <rect x="20" y="150" width="15" height="15" fill="white" opacity="0.4"/>
    <rect x="40" y="150" width="15" height="15" fill="white" opacity="0.4"/>
    <rect x="60" y="150" width="15" height="15" fill="white" opacity="0.4"/>
    <rect x="80" y="150" width="15" height="15" fill="white" opacity="0.4"/>
    
    <rect x="20" y="180" width="15" height="15" fill="white" opacity="0.4"/>
    <rect x="40" y="180" width="15" height="15" fill="white" opacity="0.4"/>
    <rect x="60" y="180" width="15" height="15" fill="white" opacity="0.4"/>
    <rect x="80" y="180" width="15" height="15" fill="white" opacity="0.4"/>
    
    <!-- Crane -->
    <line x1="140" y1="50" x2="140" y2="200" stroke="white" stroke-width="4" opacity="0.6"/>
    <line x1="140" y1="50" x2="220" y2="50" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="140" y1="70" x2="180" y2="70" stroke="white" stroke-width="2" opacity="0.5"/>
    
    <!-- Crane Hook -->
    <circle cx="200" cy="50" r="3" fill="white" opacity="0.7"/>
    <line x1="200" y1="53" x2="200" y2="80" stroke="white" stroke-width="1" opacity="0.6"/>
    <rect x="195" y="80" width="10" height="8" fill="white" opacity="0.5"/>
  </g>
  
  <!-- Smart Technology Elements -->
  <g transform="translate(450, 180)">
    <!-- Hard Hat with Sensor -->
    <ellipse cx="60" cy="80" rx="35" ry="25" fill="white" opacity="0.4"/>
    <ellipse cx="60" cy="75" rx="30" ry="20" fill="white" opacity="0.3"/>
    <circle cx="60" cy="65" r="8" fill="white" opacity="0.6"/>
    <circle cx="60" cy="65" r="4" fill="white" opacity="0.8"/>
    
    <!-- Monitoring Camera -->
    <rect x="10" y="30" width="25" height="15" rx="3" fill="white" opacity="0.5"/>
    <circle cx="22" cy="37" r="6" fill="white" opacity="0.7"/>
    <circle cx="22" cy="37" r="3" fill="white" opacity="0.9"/>
    <line x1="35" y1="37" x2="50" y2="25" stroke="white" stroke-width="2" opacity="0.4"/>
    
    <!-- Sensor Network -->
    <circle cx="100" cy="40" r="4" fill="white" opacity="0.6"/>
    <circle cx="120" cy="60" r="4" fill="white" opacity="0.6"/>
    <circle cx="80" cy="100" r="4" fill="white" opacity="0.6"/>
    
    <!-- Connection Lines -->
    <line x1="100" y1="40" x2="120" y2="60" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="120" y1="60" x2="80" y2="100" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="80" y1="100" x2="100" y2="40" stroke="white" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Safety and Monitoring Icons -->
  <g transform="translate(300, 80)">
    <!-- Safety Shield -->
    <path d="M50,10 L70,20 L70,50 L50,70 L30,50 L30,20 Z" fill="white" opacity="0.4"/>
    <path d="M50,20 L60,25 L60,45 L50,55 L40,45 L40,25 Z" fill="white" opacity="0.3"/>
    <text x="50" y="45" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.8">!</text>
    
    <!-- Data Analytics -->
    <rect x="100" y="20" width="60" height="40" rx="5" fill="white" opacity="0.3"/>
    <rect x="110" y="30" width="8" height="20" fill="white" opacity="0.5"/>
    <rect x="125" y="25" width="8" height="25" fill="white" opacity="0.6"/>
    <rect x="140" y="35" width="8" height="15" fill="white" opacity="0.4"/>
  </g>
  
  <!-- Environmental Monitoring -->
  <g transform="translate(100, 300)">
    <!-- Weather Station -->
    <rect x="0" y="20" width="4" height="40" fill="white" opacity="0.5"/>
    <circle cx="2" cy="15" r="8" fill="white" opacity="0.4"/>
    <line x1="-5" y1="10" x2="9" y2="10" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-3" y1="20" x2="7" y2="20" stroke="white" stroke-width="1" opacity="0.5"/>
    
    <!-- Air Quality Sensor -->
    <rect x="30" y="10" width="20" height="30" rx="3" fill="white" opacity="0.4"/>
    <circle cx="40" cy="20" r="3" fill="white" opacity="0.6"/>
    <circle cx="40" cy="30" r="2" fill="white" opacity="0.5"/>
    
    <!-- Noise Level Indicator -->
    <path d="M70,15 Q75,20 70,25 Q75,30 70,35" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M75,12 Q82,20 75,28 Q82,36 75,44" stroke="white" stroke-width="2" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Tech Grid Pattern Overlay -->
  <g opacity="0.15">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="800" height="600" fill="url(#grid)"/>
  </g>
</svg>
