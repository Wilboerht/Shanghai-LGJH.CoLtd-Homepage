<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="customServiceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#customServiceGradient)" opacity="0.1"/>
  
  <!-- Main Icon - Layers -->
  <g transform="translate(100, 100)">
    <!-- Layer 1 -->
    <rect x="-30" y="-20" width="60" height="8" rx="4" fill="url(#customServiceGradient)" opacity="0.6"/>
    <!-- Layer 2 -->
    <rect x="-25" y="-5" width="50" height="8" rx="4" fill="url(#customServiceGradient)" opacity="0.8"/>
    <!-- Layer 3 -->
    <rect x="-20" y="10" width="40" height="8" rx="4" fill="url(#customServiceGradient)"/>
    
    <!-- Connecting Lines -->
    <line x1="0" y1="-12" x2="0" y2="3" stroke="url(#customServiceGradient)" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="3" x2="0" y2="18" stroke="url(#customServiceGradient)" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="60" cy="60" r="3" fill="url(#customServiceGradient)" opacity="0.4"/>
  <circle cx="140" cy="60" r="3" fill="url(#customServiceGradient)" opacity="0.4"/>
  <circle cx="60" cy="140" r="3" fill="url(#customServiceGradient)" opacity="0.4"/>
  <circle cx="140" cy="140" r="3" fill="url(#customServiceGradient)" opacity="0.4"/>
</svg>
