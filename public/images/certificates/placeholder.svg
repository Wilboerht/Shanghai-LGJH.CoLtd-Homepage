<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Inner Border -->
  <rect x="20" y="20" width="360" height="260" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Certificate Icon -->
  <g transform="translate(175, 80)">
    <rect x="0" y="0" width="50" height="60" fill="#3b82f6" opacity="0.1" rx="4"/>
    <path d="M10 15 L40 15 M10 25 L40 25 M10 35 L30 35" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="35" cy="45" r="8" fill="#3b82f6" opacity="0.2"/>
    <path d="M30 45 L33 48 L40 41" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="170" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    企业资质证书
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="190" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="12">
    请上传实际证书图片
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="350" cy="50" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="50" cy="250" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="350" cy="250" r="3" fill="#3b82f6" opacity="0.3"/>
</svg>
