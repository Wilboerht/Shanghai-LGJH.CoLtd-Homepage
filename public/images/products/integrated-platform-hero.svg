<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <!-- Tech pattern gradient -->
    <radialGradient id="techGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.05" />
    </radialGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#475569" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Main background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Grid overlay -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Tech gradient overlay -->
  <rect width="1920" height="1080" fill="url(#techGradient)"/>

  <!-- Floating tech elements -->
  <!-- Top left -->
  <g transform="translate(200, 200)" opacity="0.3">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="30" cy="30" r="15" fill="none" stroke="#06b6d4" stroke-width="1"/>
  </g>

  <!-- Top right -->
  <g transform="translate(1520, 180)" opacity="0.3">
    <rect x="0" y="0" width="50" height="50" rx="6" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="25" cy="25" r="8" fill="#06b6d4" opacity="0.4"/>
  </g>

  <!-- Bottom left -->
  <g transform="translate(150, 800)" opacity="0.25">
    <rect x="0" y="0" width="70" height="70" rx="10" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#3b82f6" opacity="0.3"/>
  </g>

  <!-- Bottom right -->
  <g transform="translate(1600, 850)" opacity="0.3">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="0" cy="0" r="8" fill="#3b82f6" opacity="0.4"/>
  </g>

  <!-- Central dashboard hint -->
  <g transform="translate(960, 540)" opacity="0.2">
    <rect x="-200" y="-100" width="400" height="200" rx="15" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <rect x="-150" y="-60" width="100" height="4" rx="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="-150" y="-40" width="80" height="3" rx="1.5" fill="#06b6d4" opacity="0.5"/>
    <rect x="-150" y="-25" width="120" height="3" rx="1.5" fill="#3b82f6" opacity="0.4"/>
  </g>

  <!-- Subtle connection lines -->
  <line x1="260" y1="260" x2="760" y2="440" stroke="#3b82f6" stroke-width="0.5" opacity="0.15"/>
  <line x1="1520" y1="230" x2="1160" y2="440" stroke="#06b6d4" stroke-width="0.5" opacity="0.15"/>
  <line x1="220" y1="870" x2="760" y2="640" stroke="#3b82f6" stroke-width="0.5" opacity="0.15"/>
  <line x1="1600" y1="850" x2="1160" y2="640" stroke="#06b6d4" stroke-width="0.5" opacity="0.15"/>
</svg>
