# LGJH Homepage - 简化版 Docker Compose 配置
# 仅包含应用服务，适用于快速测试和开发

version: '3.8'

services:
  app:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: lgjh-homepage-simple
    ports:
      - '3100:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/dev.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-lgjh-cms-secret-key-change-in-production-2024}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3100}
      - PORT=3100
    volumes:
      # 数据持久化
      - ../../prisma:/app/prisma
      - ../../public/uploads:/app/public/uploads
      - ../../logs:/app/logs
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
