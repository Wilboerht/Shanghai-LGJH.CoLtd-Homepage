# Docker Compose 配置 - SQLite 版本
#
# 此配置文件专为使用 SQLite 数据库的部署设计
# 相比 PostgreSQL 版本，具有以下优势：
# - 无需额外的数据库服务器
# - 部署更简单
# - 适合中小型应用
# - 数据文件直接存储在文件系统中

version: '3.8'

services:
  # 主应用服务
  app:
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - '3100:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - NEXTAUTH_SECRET=your-secret-key-here
      - NEXTAUTH_URL=http://localhost:3100
    volumes:
      # SQLite 数据库文件目录
      - ../../prisma:/app/prisma
      # 上传文件目录
      - ../../public/uploads:/app/public/uploads
      # 日志目录
      - ../../logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理 (可选)
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis_data:
    driver: local

# 网络配置 (可选)
networks:
  default:
    name: lgjh-network
